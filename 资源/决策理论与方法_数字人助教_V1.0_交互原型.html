function homeView(){return `<div class="hero"><div class="hero-copy"><span class="pill purple">✦ 你的专属 AI 课程学习伙伴</span><h1>让复杂的决策理论<br>变得<span style="color:#6658df">清晰易懂</span></h1><p>从知识点主动讲解，到实时答疑与动态案例。让3D虚拟助教陪你理解方法、练习应用，而不只是查找答案。</p><div class="hero-buttons"><button class="btn btn-primary" data-act="nav" data-view="catalog">${icon('book')} 开始课程学习 ${icon('arrow')}</button><button class="btn" data-act="nav" data-view="qa">${icon('chat')} 直接提问</button></div></div><div class="hero-art">${avatar('hero-avatar')}</div></div><div class="section-row"><div><div class="eyebrow">YOUR LEARNING</div><h2 class="h2">学习概览</h2></div><span class="section-label">演示数据仅保存在当前浏览器</span></div><div class="stats-row"><div class="stat"><div class="stat-label">已进入知识点</div><div class="stat-num">${numLearned()}<span style="font-size:14px;color:#a2a5b5"> / ${topics.length}</span></div><div class="stat-note">查看已保存学习进度</div></div><div class="stat"><div class="stat-label">历史错题</div><div class="stat-num">${store.wrong.length}</div><div class="stat-note">可在复习页回看</div></div><div class="stat"><div class="stat-label">本地答疑消息</div><div class="stat-num">${store.chat.length}</div><div class="stat-note">演示问答记录</div></div></div><div class="section-row"><div><div class="eyebrow">EXPLORE</div><h2 class="h2">今天想怎样学习？</h2></div></div><div class="three-cols"><div class="card feature-card"><div class="feature-icon purple">${icon('book',24)}</div><h3 class="h3">从知识点开始</h3><p>打开课程目录，数字人连续讲解理论与案例；听不懂随时暂停提问。</p><button class="btn btn-small btn-soft" data-act="nav" data-view="catalog">进入课程目录 ${icon('arrow')}</button></div><div class="card feature-card"><div class="feature-icon mint">${icon('chat',24)}</div><h3 class="h3">遇到问题直接问</h3><p>支持文字、题目图片和浏览器语音输入，提供方法分析与分步讲解。</p><button class="btn btn-small btn-soft" data-act="nav" data-view="qa">打开智能答疑 ${icon('arrow')}</button></div><div class="card feature-card"><div class="feature-icon orange">${icon('bookmark',24)}</div><h3 class="h3">复习与错题回顾</h3><p>自主查看知识速览和练习题，曾做错的题目会在相关知识点提示。</p><button class="btn btn-small btn-soft" data-act="nav" data-view="review">查看复习记录 ${icon('arrow')}</button></div></div><div class="info-bar"><span>✦ <b>试试完整交互：</b>选择“正理想解与负理想解” → 开始讲解 → 暂停提问 → 更换案例 → 返回继续。</span><button class="btn btn-small" data-act="openTopic" data-topic="topsis-ideal">体验示例知识点 ${icon('arrow')}</button></div>`}
function catalogView(){const filtered=topics.filter(t=>(state.chapter==='all'||state.chapter===t.chapter)&&(!state.search||(`${t.title}${t.desc}${t.chapter}`).toLowerCase().includes(state.search.toLowerCase())));const chapters=[...new Set(topics.map(t=>t.chapter))];return `<div class="catalog-head"><div><div class="eyebrow">COURSE LIBRARY</div><h1 class="h1">课程知识点目录</h1><p class="sub">选择一个知识点，数字人将主动讲解；你可以随时暂停、追问或进入复习。</p></div><div class="search">${icon('search')}<input aria-label="搜索知识点" id="topicSearch" placeholder="搜索知识点..." value="${esc(state.search)}" /></div></div><div class="catalog-layout"><aside class="card chapter-panel"><div class="chapter-title">课程章节</div><button class="chapter-btn ${state.chapter==='all'?'active':''}" data-act="chapter" data-chapter="all">${icon('grid')} <span>全部知识点</span> <span class="tiny">${topics.length}</span></button>${chapters.map(c=>`<button class="chapter-btn ${state.chapter===c?'active':''}" data-act="chapter" data-chapter="${esc(c)}">${icon('book')}<span>${esc(c)}</span></button>`).join('')}</aside><div>${filtered.length?`<div class="topic-grid">${filtered.map(t=>{const pr=store.progress[t.id],pct=pr?Math.min(100,Math.round((pr.section+1)/4*100)):0;return `<div class="card topic-card"><div class="topic-card-top"><span class="pill purple">${esc(t.type)}</span><span class="tiny">${pr?'学习中':'尚未学习'}</span></div><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="topic-card-footer"><span class="tiny">${pct}% · ${wrongFor(t.id).length} 道历史错题</span><button class="btn btn-small btn-primary" data-act="openTopic" data-topic="${t.id}">${pr?'继续学习':'开始学习'} ${icon('arrow')}</button></div></div>`}).join('')}</div>`:`<div class="card empty">没有找到匹配的知识点，请尝试其他关键词。</div>`}<div class="notice" style="margin-top:19px">目录为原型演示使用的示例结构，正式课程目录需依据《决策理论与方法》的课堂资料替换。这里不预设首版的实际章节覆盖范围。</div></div></div>`}

function lessonSpeech(){const t=topic(),cs=activeCase();switch(state.section){case 0:return `欢迎学习${t.title}。今天我们先了解这个知识点解决什么问题，再通过一个情境把抽象理论变得具体。${t.base}`;case 1:return `${t.base} ${isTopsis()?'注意，成本型指标通常是越小越好，效益型指标越大越好。进行距离比较前，通常还需要按课程方法进行标准化和加权。':'接下来，我们结合一个与学习和管理决策相关的情境进行理解。'}`;case 2:return `${cs.title}。${cs.intro} ${isTopsis()?'这里显示的是模拟数据。你可以尝试调整指标权重，观察不同方案的贴近度和排序如何变化。':'这是一个教学模拟情境，用来帮助理解知识点，你可以要求更换案例或继续追问。'}`;default:return `这一节最重要的是理解：${t.base} 学习结束后可以选择知识点速览、做一道练习，或者随时向我提问。`}}
function scoreTopsis(c,rawWeights){const w=rawWeights.map(Number),sum=w.reduce((a,b)=>a+b,0)||1;const weights=w.map(x=>x/sum);const vals=c.data.map(r=>r.values);const norms=c.criteria.map((_,j)=>Math.sqrt(vals.reduce((a,row)=>a+row[j]**2,0))||1);const matrix=vals.map(row=>row.map((v,j)=>v/norms[j]*weights[j]));const ideals=c.criteria.map((crit,j)=>crit.benefit?Math.max(...matrix.map(r=>r[j])):Math.min(...matrix.map(r=>r[j])));const anti=c.criteria.map((crit,j)=>crit.benefit?Math.min(...matrix.map(r=>r[j])):Math.max(...matrix.map(r=>r[j])));return matrix.map((row,i)=>{const dp=Math.sqrt(row.reduce((a,v,j)=>a+(v-ideals[j])**2,0));const dm=Math.sqrt(row.reduce((a,v,j)=>a+(v-anti[j])**2,0));return {name:c.data[i].name,score:dp+dm===0?0.5:dm/(dp+dm),dp,dm}}).sort((a,b)=>b.score-a.score)}
function caseDisplay(){const c=activeCase();if(!isTopsis())return `<div class="concept-box"><h4>${esc(c.title)}</h4><p>${esc(c.intro)}</p></div><div class="case-tools"><span class="pill purple">教学模拟案例</span><button class="btn btn-small btn-soft" data-act="changeCase">${icon('refresh')} 换个情境</button></div><div class="help-note">这里的案例来自原型内置示例。正式产品将由大模型生成新案例，并在适用时完成知识与计算校验。</div>`;
 const w=currentWeights(),result=scoreTopsis(c,w);return `<div class="case-tools"><div><div class="case-title">${esc(c.title)}</div><div class="tiny" style="margin-top:5px">${esc(c.intro)}</div></div><button class="btn btn-small btn-soft" data-act="changeCase">${icon('refresh')} 换个案例</button></div><span class="pill purple">模拟数据 · 前端真实执行 TOPSIS 演算</span><div style="overflow:auto"><table class="case-table"><thead><tr><th>方案</th>${c.criteria.map(q=>`<th>${esc(q.name)} ${q.benefit?'↑':'↓'}</th>`).join('')}</tr></thead><tbody>${c.data.map(r=>`<tr><td><b>${esc(r.name)}</b></td>${r.values.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div style="font-size:13px;font-weight:780;margin:19px 0 12px">尝试调整三个指标的相对权重</div>${c.criteria.map((crit,i)=>`<label class="weight-row"><span>${esc(crit.name)}</span><input type="range" min="0" max="100" step="5" value="${w[i]}" data-weight="${i}" aria-label="${esc(crit.name)}权重"/><strong>${w[i]}</strong></label>`).join('')}<div class="tiny" style="margin:5px 0 13px">权重按当前数值之和自动归一化；可调任意比例。</div><div class="concept-box" style="background:#f9fbff;border-left-color:#2da994"><h4>相对贴近度（越高代表越接近正理想解）</h4>${result.map((r,i)=>`<div class="result-row"><div class="result-name">${i===0?'★ ':''}${esc(r.name)}</div><div class="result-track"><div style="width:${(r.score*100).toFixed(2)}%"></div></div><div class="result-val">${r.score.toFixed(3)}</div></div>`).join('')}<p style="font-size:11px;color:#939aaa;margin-top:13px">演算使用向量归一化、加权矩阵、欧氏距离和贴近度 C = D⁻ / (D⁺ + D⁻)。仅作教学演示，具体公式以课程资料为准。</p></div>`}
function lessonSection(){const t=topic();if(state.section===0)return `<div class="eyebrow">LESSON 01 · INTRODUCTION</div><h2>从一个真实问题开始</h2><p>欢迎来到 <b>${esc(t.title)}</b>。本节先回答两个问题：这项知识能帮助我们分析什么，以及为什么有必要学习它？</p><div class="concept-box"><h4>本节学习目标</h4><p>${esc(t.desc)}。听完后，你应该能够用自己的话解释核心思想，并尝试识别它适用的情境。</p></div><p>点击右侧“开始连续讲解”，数字人将自动衔接后续阶段。讲解中可以随时暂停、提问，不需要每段都点击继续。</p>`;
if(state.section===1)return `<div class="eyebrow">LESSON 02 · THEORY</div><h2>${esc(t.title)} · 核心理论</h2><p>${esc(t.base)}</p>${isTopsis()?`<div class="formula"><small>TOPSIS 相对贴近度 · 常见表达式</small>Cᵢ = Dᵢ⁻ / (Dᵢ⁺ + Dᵢ⁻)</div><p><b>Dᵢ⁺</b> 表示方案到正理想解的距离，<b>Dᵢ⁻</b> 表示到负理想解的距离。公式背后的思想是“靠近理想、远离较差”。</p><div class="concept-box"><h4>容易混淆的地方</h4><p>理想解通常是由各指标的优值组合而成的参照点，并不一定对应某一个真实方案；成本型和效益型指标的最优方向也不同。</p></div>`:`<div class="concept-box"><h4>你需要理解的核心问题</h4><p>该方法适合什么条件？需要哪些输入？所得结果应该如何解释？试着把这三个问题带入下一段案例。</p></div>`}`;
if(state.section===2)return `<div class="eyebrow">LESSON 03 · DYNAMIC CASE</div><h2>用一个案例理解方法</h2><p>数字人将案例与理论结合。你可以切换情境，或者在 TOPSIS 演示中调整权重，观察决策结果变化。</p>${caseDisplay()}`;
return `<div class="eyebrow">LESSON 04 · RECAP</div><h2>回顾今天的重点</h2><div class="concept-box"><h4>核心知识</h4><p>${esc(t.base)}</p></div><p>你可以从这里直接进入知识点速览，也可以做一道方法辨析或概念练习；如果仍有疑问，数字人随时可以继续解释。</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:25px"><button class="btn btn-soft" data-act="reviewTab" data-tab="summary">${icon('bookmark')} 知识点速览</button><button class="btn btn-primary" data-act="reviewTab" data-tab="quiz">${icon('list')} 做一道练习</button></div>`}

ction" title="下一段">${icon('next')}</button></div><div class="player-sub"><span>${state.playing&&!state.paused?'讲解中 · 连续播放':state.paused?'已暂停':state.lessonFinished?'讲解完成':'点击开始连续讲解'}</span><span>${state.section+1} / 4</span></div><div class="progress-track" style="margin-top:9px"><div class="progress-fill" style="width:${(state.section+1)*25}%"></div></div></div><div class="speechbubble"><b>当前播报内容：</b>${esc(lessonSpeech()).slice(0,106)}${lessonSpeech().length>106?'…':''}</div><div class="action-stack"><button class="btn btn-soft" data-act="askLesson">${icon('chat')} 文字追问</button><button class="btn btn-soft" data-act="micLesson">${icon('mic')} 语音提问</button><button class="btn" data-act="changeCase">${icon('refresh')} 换个案例</button><button class="btn" data-act="reviewTab" data-tab="summary">${icon('bookmark')} 复习速览</button></div><div class="tiny" style="line-height:1.8;margin-top:13px">形象为2D SVG模拟3D角色；说话口型仅是播放状态动画，不是真实音素级同步。</div></aside></div><div class="review-box" id="lessonReview"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><h3 class="h3">自主复习与巩固</h3><div class="tiny" style="margin-top:7px">想复习时再打开，无需等数字人播放结束。</div></div><span class="pill ${wrongFor(t.id).length?'amber':'green'}">${wrongFor(t.id).length?wrongFor(t.id).length+' 道历史错题':'暂无历史错题'}</span></div>${reviewEmbedded()}</div>`}

function quizHtml(q){return `<div class="quiz"><div class="pill purple" style="margin-bottom:10px">单题练习 · 演示题库</div><h3 style="font-size:15px;line-height:1.8;margin:0 0 13px">${esc(q.q)}</h3>${q.opts.map((x,i)=>`<label class="option ${state.quizChoice===i?'selected':''} ${state.quizChecked&&i===q.a?'correct':''} ${state.quizChecked&&state.quizChoice===i&&i!==q.a?'incorrect':''}"><input type="radio" name="quiz" data-quizchoice="${i}" ${state.quizChoice===i?'checked':''} ${state.quizChecked?'disabled':''}/><b style="font-size:11px;color:#8a82c7">${'ABCD'[i]}</b> ${esc(x)}</label>`).join('')}${state.quizChecked?`<div class="feedback ${state.quizChoice===q.a?'good':'bad'}"><b>${state.quizChoice===q.a?'回答正确':'本题需要再巩固'}</b><br>${esc(q.reason)}</div><button class="btn btn-small" data-act="resetQuiz">${icon('refresh')} 重新练习</button>`:`<button class="btn btn-primary" data-act="submitQuiz" ${state.quizChoice===null?'disabled':''}>提交答案 ${icon('arrow')}</button>`}</div>`}
function wrongHtml(items,small){return items.length?`<div style="border:1px solid var(--border);border-radius:13px;overflow:hidden">${items.slice().reverse().map(x=>`<div class="wrong-item"><div class="tiny">${new Date(x.date).toLocaleDateString('zh-CN')} · ${esc((topics.find(t=>t.id===x.topic)||{}).title||'')}</div><h4>${esc(x.question)}</h4><p>你的回答：${esc(x.chosen)}</p><p>正确答案：${esc(x.correct)}</p><p>${esc(x.reason)}</p><button class="btn btn-small btn-soft" data-act="retryWrong" data-topic="${x.topic}">${icon('refresh')} 返回知识点再练</button></div>`).join('')}</div>`:`<div class="empty">${icon('check',28)}<div>还没有该${small?'知识点的':''}历史错题。答错正式练习后，会自动保留在这里。</div></div>`}
function composer(context){const img=state.image;return `<div class="composer"><div class="composer-box">${img?`<div class="attach-preview"><img src="${img.data}" alt="所选题目图片预览"/><span>${esc(img.name)} · 图片内容未识别</span><button class="iconbtn" data-act="removeImage" aria-label="移除图片" style="width:28px;height:28px">${icon('close',15)}</button></div>`:''}<textarea id="${context==='lesson'?'lessonQuestion':'qaQuestion'}" data-chatinput="${context}" placeholder="例如：为什么要标准化？这道题应该用什么方法？" aria-label="输入你的课程问题"></textarea><div class="composer-footer"><div class="composer-tools"><button data-act="pickImage" title="上传题目图片（预览演示）">${icon('image')}</button><button data-act="mic" title="浏览器语音识别（若支持）">${icon('mic')}</button><button data-act="exampleText" title="填入示例问题">${icon('spark')}</button></div><button class="btn btn-primary btn-small" data-act="sendMessage" data-context="${context}">发送 ${icon('send',15)}</button></div></div><div class="tiny" style="margin-top:9px">${context==='lesson'?'当前知识点上下文已关联 · 关闭提问面板可返回讲解':'演示答疑使用内置规则，不是已接入大模型。'} 图片仅预览，OCR待接入。</div></div>`}
function chatMessages(context){const list=context==='lesson'?(state.lessonChat[state.topic]||[]):store.chat;return list.length?list.map(m=>`<div class="message ${m.role==='user'?'mine':''}"><div class="msg-icon">${m.role==='user'?'我':'知'}</div><div><div class="msg-content">${esc(m.text)}</div><div class="msg-meta">${m.role==='user'?'学生':'演示回复 · 非实时 AI'}</div></div></div>`).join(''):`<div class="message"><div class="msg-icon">知</div><div><div class="msg-content">你好！我是知知，你的《决策理论与方法》数字人助教。你可以问我课程概念、方法选择和解题步骤，也可以上传题目图片（本原型暂不识别图片内容）。</div><div class="msg-meta">本地规则化演示</div></div></div>`}
function qaView(){return `<div class="eyebrow">AI COURSE ASSISTANT</div><h1 class="h1">有问题，随时问知知</h1><p class="sub">自由输入课程问题，或选择图片、语音输入。系统可提供课程概念解释、方法分析和分步解题。</p><div class="qa-grid"><div class="card chat-card"><div class="chat-head"><div class="feature-icon purple" style="margin:0;width:39px;height:39px">${icon('spark')}</div><div style="flex:1"><b>智能答疑会话</b><div class="tiny" style="margin-top:4px">文字 / 图片预览 / 浏览器语音识别</div></div><button class="btn btn-small" data-act="clearChat">${icon('trash')} 清空会话</button></div><div class="chatlog" id="qaChatlog">${chatMessages('qa')}</div>${composer('qa')}</div><aside class="card qa-aside"><h3 class="h3">不知道怎么提问？</h3>${['正理想解和负理想解的区别是什么？','做多指标决策应该用什么方法？','为什么 TOPSIS 需要标准化？','AHP 的一致性检验有什么作用？'].map(x=>`<button class="suggestion" data-act="askPreset" data-question="${esc(x)}">${icon('chat',15)} ${esc(x)}</button>`).join('')}<div class="line"></div><div class="mini-callout"><b>让问题回到课程学习</b><br>如果一个问题需要系统讲解，可以直接进入对应知识点学习页面，继续由数字人带着学。<br><button class="btn btn-small btn-primary" data-act="openTopic" data-topic="topsis-ideal" style="margin-top:13px">去学习示例知识点 ${icon('arrow')}</button></div><div class="notice" style="margin-top:15px">本 HTML 离线可浏览。完整 RAG、图像 OCR、实时双向语音与 3D 音素同步需要接入第三方服务，本文件不会假装已完成这些功能。</div></aside></div>`}
function reviewView(){const wrong=store.wrong;return `<div class="eyebrow">REVIEW & RECORDS</div><h1 class="h1">复习与学习记录</h1><p class="sub">复习不另建独立课程系统。这里用于回看学习记录和错题；练习与速览仍在知识点页面自主使用。</p><div class="review-grid"><section class="card review-main"><div class="tabs"><button class="tab ${state.reviewTab!=='wrong'?'active':''}" data-act="reviewGlobal" data-tab="summary">学习进度</button><button class="tab ${state.reviewTab==='wrong'?'active':''}" data-act="reviewGlobal" data-tab="wrong">历史错题 (${wrong.length})</button></div>${state.reviewTab==='wrong'?wrongHtml(wrong,false):`<h3 class="h3" style="margin-bottom:18px">已进入的知识点</h3>${Object.keys(store.progress).length?Object.keys(store.progress).map(id=>{const t=topics.find(x=>x.id===id);if(!t)return '';const p=store.progress[id];return `<div class="wrong-item" style="padding:17px 0"><div style="display:flex;align-items:center;justify-content:space-between;gap:15px"><div><b style="font-size:14px">${esc(t.title)}</b><div class="tiny" style="margin-top:7px">上次停留：${lessonParts[p.section]||lessonParts[0]} · ${new Date(p.updated).toLocaleDateString('zh-CN')}</div></div><button class="btn btn-small btn-soft" data-act="openTopic" data-topic="${id}">继续学习 ${icon('arrow')}</button></div></div>`}).join(''):`<div class="empty">${icon('book',30)}<div>还没有学习进度。打开一个知识点后便会自动保存。</div><button class="btn btn-primary" data-act="nav" data-view="catalog" style="margin-top:16px">去课程目录</button></div>`}`}</section><aside class="card review-detail"><div class="feature-icon orange">${icon('bookmark',23)}</div><h3 class="h3">复习属于知识点学习的一部分</h3><p class="compact">从课程目录进入知识点后，可选择“知识点速览”“做一道练习”和“历史错题”。你始终决定何时复习，系统仅提示此前做错的题。</p><div class="line"></div><span class="pill green">轻量记录 · 无复杂学习画像</span><p class="compact" style="margin-top:17px">已学知识点：<b>${numLearned()}</b><br>记录的历史错题：<b>${wrong.length}</b><br>数据存储位置：<b>当前浏览器 localStorage</b></p><button class="btn btn-soft" data-act="nav" data-view="catalog" style="margin-top:12px;width:100%">进入知识点目录 ${icon('arrow')}</button></aside></div>`}
function drawerView(){return state.chatOpen?`<div class="drawer-shade" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="当前知识点即时提问"><div class="drawer-head"><div><b>向知知提问</b><div class="tiny" style="margin-top:4px">当前知识点：${esc(topic().title)} · 讲解已暂停</div></div><button class="iconbtn" data-act="closeDrawer" aria-label="关闭提问">${icon('close')}</button></div><div class="chatlog" id="lessonChatlog">${chatMessages('lesson')}</div>${composer('lesson')}<div class="drawer-footer"><button class="btn btn-primary" style="width:100%" data-act="returnLesson">${icon('play')} 返回刚才的讲解（从本段开头恢复）</button></div></aside>`:''}
function modalView(){if(!state.modal)return '';if(state.modal==='resume'){const t=topic(),p=store.progress[t.id];return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><span class="pill purple">${icon('clock',14)} 学习进度已保存</span><h2>欢迎回来，要从哪里开始？</h2><p>你上次学习了「${esc(t.title)}」，停留在 <b>${lessonParts[p?.section||0]}</b>。继续学习会恢复原来的案例及讲解阶段。</p><div class="progress-track" style="margin:20px 0"><div class="progress-fill" style="width:${((p?.section||0)+1)*25}%"></div></div><div class="modal-actions"><button class="btn btn-primary" data-act="resumeTopic">${icon('play')} 继续上次</button><button class="btn" data-act="restartTopic">${icon('refresh')} 从头开始</button></div><button class="btn btn-ghost" data-act="cancelTopic" style="width:100%;margin-top:10px">先返回目录</button></div></div>`}
if(state.modal==='info')return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><span class="pill purple">INTERACTIVE PROTOTYPE</span><h2>这份 HTML 能做什么？</h2><p>这是可离线打开的前端产品原型，不是完整后端系统。已实现真实的本地页面导航、目录筛选、浏览器语音合成、连续讲解、暂停追问、演示问答、案例切换、TOPSIS 数值计算、作答反馈、错题和进度保存。</p><p><b>尚未接入：</b>大模型 API、课程 RAG、图片 OCR、实时流式语音服务、真正的可驱动3D模型、音素级口型同步。语音识别是否可用由当前浏览器及权限决定。</p><p>课程章节与示例数据用于交互展示，不能替代实际教学资料。</p><button class="btn btn-primary" style="width:100%;margin-top:13px" data-act="closeModal">我知道了</button></div></div>`;return ''}
function render(){let c=state.view==='home'?homeView():state.view==='catalog'?catalogView():state.view==='lesson'?lessonView():state.view==='qa'?qaView():reviewView();let name={home:'欢迎回来 / 首页',catalog:'课程学习 / 知识点目录',lesson:'课程学习 / '+topic().title,qa:'智能答疑 / 自由提问',review:'学习记录 / 复习与错题'}[state.view];document.getElementById('app').innerHTML=layout(c,name)+drawerView()+modalView();scrollChat();}
function scrollChat(){requestAnimationFrame(()=>['qaChatlog','lessonChatlog'].forEach(id=>{const el=document.getElementById(id);if(el)el.scrollTop=el.scrollHeight}))}
function stopSpeech(){token++;try{if('speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.resume()}}catch(e){}state.playing=false;state.paused=false;state.speaking=false;state.speakKind=''}
function speech(text,kind,onEnd){stopSpeech();if(!('speechSynthesis' in window)){toast('当前浏览器不支持语音合成，请使用文字讲解与下一段按钮。');return}const my=token;let utter=new SpeechSynthesisUtterance(text);utter.lang='zh-CN';utter.rate=.93;utter.pitch=1.04;const voices=speechSynthesis.getVoices();const voice=voices.find(x=>x.lang.toLowerCase().startsWith('zh'));if(voice)utter.voice=voice;state.speakKind=kind;state.playing=kind==='lesson';utter.onstart=()=>{if(token!==my)return;state.speaking=true;updateAvatar()};utter.onend=()=>{if(token!==my)return;state.speaking=false;state.playing=false;updateAvatar();if(onEnd)onEnd()};utter.onerror=(e)=>{if(token!==my)return;state.speaking=false;state.playing=false;updateAvatar();if(e.error!=='interrupted'&&e.error!=='canceled')toast('语音播放未能完成，请检查浏览器的中文语音支持。')};speechSynthesis.speak(utter);updateAvatar()}
function updateAvatar(){document.querySelectorAll('.avatar-scene').forEach(x=>x.classList.toggle('speaking',state.speaking));}
function playLesson(){if(state.view!=='lesson')return;state.lessonFinished=false;speech(lessonSpeech(),'lesson',()=>{if(state.view!=='lesson'||state.chatOpen)return;if(state.section<3){state.section++;saveProgress();render();setTimeout(()=>{if(state.view==='lesson'&&!state.chatOpen)playLesson()},60)}else{state.lessonFinished=true;saveProgress();render();toast('本节讲解完成，可以复习、练习或继续提问。')}});render()}
function toggleLesson(){if(state.playing&&!state.paused){try{speechSynthesis.pause()}catch(e){}state.paused=true;state.speaking=false;render();return}if(state.paused){try{speechSynthesis.resume()}catch(e){}state.paused=false;state.speaking=true;render();return}playLesson()}
function navigate(v){stopSpeech();state.chatOpen=false;state.modal='';state.image=null;state.view=v;if(v==='review')state.reviewTab='summary';render();window.scrollTo({top:0,behavior:'smooth'})}
function enterTopic(id){stopSpeech();state.topic=id;state.chatOpen=false;state.image=null;state.lessonFinished=false;state.reviewTab='summary';state.quizChoice=null;state.quizChecked=false;if(store.progress[id]){state.modal='resume';render()}else{state.section=0;state.caseIndex=0;state.weights=[];state.view='lesson';saveProgress();render();window.scrollTo(0,0)}}
function restoreTopic(start){const p=store.progress[state.topic];state.modal='';state.section=start?0:(p?.section??0);state.caseIndex=start?0:(p?.caseIndex??0);state.weights=start?[]:(p?.weights||[]);state.view='lesson';state.lessonFinished=false;saveProgress();render();window.scrollTo(0,0);toast('已进入知识点。点击数字人播放按钮开始连续讲解。')}
function jumpSection(n,auto){stopSpeech();state.section=Math.max(0,Math.min(3,n));saveProgress();render();if(auto)playLesson()}
function changeCase(){const was=state.playing&&!state.paused;stopSpeech();state.caseIndex++;state.weights=[];saveProgress();if(state.view==='lesson'&&state.section!==2){state.section=2;saveProgress()}render();toast('已切换原型内置的演示案例。正式版将调用 AI 实时生成并校验。');if(was&&state.view==='lesson')playLesson()}
function openDrawer(){const was=state.playing&&!state.paused;stopSpeech();state.pendingReturn=was;state.chatOpen=true;state.image=null;render()}
function closeDrawer(resume){stopSpeech();state.chatOpen=false;state.image=null;render();if(resume||state.pendingReturn){state.pendingReturn=false;playLesson()}else toast('已返回知识点讲解页面。点击播放可继续。')}
function responseTo(msg){const text=msg.toLowerCase(),t=topic();if(/标准化|归一化/.test(text))return '标准化通常是为了消除不同指标的量纲和数量级带来的影响。例如薪资是几千元、通勤只有几十分钟，直接比较原值不合适。TOPSIS 的具体标准化方式应以课程所用方法为准。你可以返回案例段查看完整计算。';if(/负理想|正理想|理想解/.test(text))return '正理想解由处理后的各指标最优值组成，负理想解由最差值组成。它们一般是参照点，不一定是真实存在的方案。TOPSIS 用两种距离和相对贴近度综合比较方案。';if(/权重/.test(text))return '权重表示各指标在综合评价中的相对重要性。例如更看重薪资、还是更看重通勤，会影响 TOPSIS 排序。进入 TOPSIS 案例段后，可以拖动权重滑块观察贴近度变化。';if(/ahp|一致性|判断矩阵|层次分析/.test(text))return 'AHP 通常先建立目标、准则和方案等层次，通过两两比较形成判断矩阵，再求权重并检查判断的一致性。如果出现 A 比 B 重要、B 比 C 重要，而 C 又明显比 A 重要的比较，可能意味着判断不够协调。';if(/方法|哪个|怎么选/.test(text))return '方法选择需要先判断问题目标、数据性质以及是否有明确的状态概率。多指标方案评价可以考虑 TOPSIS；偏向层级准则与主观比较时可考虑 AHP；存在已知自然状态概率时可以考虑期望值决策。这里是演示性说明，正式系统应依据课程资料和完整题目条件推荐。';if(/算|步骤|计算|公式/.test(text))return '先整理已知条件，再确认适用方法与公式。如果是 TOPSIS，通常包括指标处理、向量标准化、加权、确定正负理想解、计算距离和贴近度。你可以在课程学习的“案例演示”段调整权重，查看前端实际计算出的结果。';if(/复习|考试|总结/.test(text))return '可以从课程目录选择需要回顾的知识点，进入“知识点速览”和“做一道练习”。本原型还会保存正式练习中的错题，帮助你再次查看。';if(/案例|例子/.test(text))return '可以的。例如在“实习岗位选择”中，薪资、通勤时间和发展机会各有优劣。这个情境可以帮助理解为何多属性决策需要综合比较。进入 TOPSIS 知识点的案例段还可以切换模拟案例并计算贴近度。';return `我理解你的问题与《决策理论与方法》有关。当前 HTML 使用本地规则化演示，暂时无法像大模型那样完整推理。

当前示例知识点“${t.title}”的重点是：${t.base}

正式版本会通过课程知识检索和模型 API 回答，并在需要时给出来源、动态案例和分步计算。`}
function sendMessage(context,forced){const el=document.getElementById(context==='lesson'?'lessonQuestion':'qaQuestion');let msg=String(forced??el?.value??'').trim();if(!msg){if(state.image){toast('此原型没有接入图片 OCR。请在输入框补充或手动转写题目，再发送。')}else toast('请先输入问题。');return}const list=context==='lesson'?(state.lessonChat[state.topic]||(state.lessonChat[state.topic]=[])):store.chat;const attachment=state.image?`\n[已附图片：${state.image.name}，本原型未进行OCR]`:'';list.push({role:'user',text:msg+attachment});list.push({role:'bot',text:responseTo(msg)});if(context==='qa')persist();state.image=null;render();if(state.voiceEnabled&&context==='lesson')speech(responseTo(msg),'answer',null)}
function listen(context){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('当前浏览器不支持语音识别。请使用文字输入；完整实时语音需要接入音频 SDK。');return}try{if(recognizer){recognizer.stop();recognizer=null}recognizer=new SR();recognizer.lang='zh-CN';recognizer.interimResults=false;recognizer.maxAlternatives=1;recognizer.onresult=e=>{const inp=document.getElementById(context==='lesson'?'lessonQuestion':'qaQuestion');if(inp){inp.value=(inp.value?inp.value+' ':'')+e.results[0][0].transcript;inp.focus();toast('已填入语音识别内容，请核对后发送。')}};recognizer.onerror=e=>toast('语音识别未成功：'+e.error+'。可直接输入文字。');recognizer.start();toast('请对麦克风说话。识别内容将填入问题框。')}catch(e){toast('无法启动麦克风，请检查权限或浏览器设置。')}}
function selectQuiz(i){if(state.quizChecked)return;state.quizChoice=i;render();const el=document.getElementById('lessonReview');if(el)el.scrollIntoView({block:'nearest'})}
function submitQuiz(){if(state.quizChoice===null)return;const q=quizBank[state.topic];state.quizChecked=true;if(state.quizChoice!==q.a){store.wrong.push({topic:state.topic,question:q.q,chosen:q.opts[state.quizChoice],correct:q.opts[q.a],reason:q.reason,date:Date.now()});persist()}render();const el=document.getElementById('lessonReview');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function act(name,b){switch(name){case 'nav':navigate(b.dataset.view);break;case 'chapter':state.chapter=b.dataset.chapter;render();break;case 'openTopic':enterTopic(b.dataset.topic);break;case 'resumeTopic':restoreTopic(false);break;case 'restartTopic':restoreTopic(true);break;case 'cancelTopic':state.modal='';state.view='catalog';render();break;case 'showInfo':state.modal='info';render();break;case 'closeModal':state.modal='';render();break;case 'toggleLesson':toggleLesson();break;case 'gotoSection':jumpSection(Number(b.dataset.section),state.playing&&!state.paused);break;case 'nextSection':jumpSection(state.section+1,state.playing&&!state.paused);break;case 'prevSection':jumpSection(state.section-1,state.playing&&!state.paused);break;case 'changeCase':changeCase();break;case 'askLesson':openDrawer();break;case 'micLesson':openDrawer();setTimeout(()=>listen('lesson'),50);break;case 'closeDrawer':closeDrawer(false);break;case 'returnLesson':closeDrawer(true);break;case 'reviewTab':state.reviewTab=b.dataset.tab;state.quizChoice=null;state.quizChecked=false;render();document.getElementById('lessonReview')?.scrollIntoView({behavior:'smooth',block:'nearest'});break;case 'reviewGlobal':state.reviewTab=b.dataset.tab;render();break;case 'submitQuiz':submitQuiz();break;case 'resetQuiz':state.quizChoice=null;state.quizChecked=false;render();break;case 'retryWrong':enterTopic(b.dataset.topic);state.reviewTab='quiz';break;case 'sendMessage':sendMessage(b.dataset.context);break;case 'clearChat':store.chat=[];persist();render();toast('本地答疑会话已清空。');break;case 'askPreset':sendMessage('qa',b.dataset.question);break;case 'pickImage':document.getElementById('imagePicker').click();break;case 'removeImage':state.image=null;render();break;case 'mic':listen(state.chatOpen?'lesson':'qa');break;case 'exampleText':{const input=document.getElementById(state.chatOpen?'lessonQuestion':'qaQuestion');if(input){input.value='为什么 TOPSIS 要进行标准化？';input.focus()}break}default:break}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();act(b.dataset.act,b)}});
document.addEventListener('change',e=>{if(e.target.matches('input[data-quizchoice]'))selectQuiz(Number(e.target.dataset.quizchoice));if(e.target.id==='imagePicker'){const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('请选择图片文件。');return}if(f.size>5*1024*1024){toast('原型图片大小建议不超过5MB。');return}const reader=new FileReader();reader.onload=()=>{state.image={name:f.name,data:reader.result};render();toast('已附加图片。此原型仅展示预览，请手动输入题目内容。')};reader.readAsDataURL(f);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='topicSearch'){state.search=e.target.value;const caret=e.target.selectionStart;render();const inp=document.getElementById('topicSearch');inp?.focus();inp?.setSelectionRange(caret,caret)}if(e.target.matches('input[data-weight]')){let i=+e.target.dataset.weight;state.weights=currentWeights().slice();state.weights[i]=+e.target.value;saveProgress();const active=document.activeElement;const idx=i;render();document.querySelector(`input[data-weight="${idx}"]`)?.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){state.modal='';render()}else if(state.chatOpen)closeDrawer(false)}if(e.key==='Enter'&&!e.shiftKey&&e.target.matches('textarea[data-chatinput]')){e.preventDefault();sendMessage(e.target.dataset.chatinput)}});
window.addEventListener('beforeunload',()=>{try{speechSynthesis.cancel()}catch(e){}});
render();
</script>
</body>
</html>
